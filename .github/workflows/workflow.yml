name: CI/CD Pipeline

'on':
  pull_request:
  push:
    tags: ['v*']

env:
  LATEST_PYTHON_VERSION: '3.14'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: astral-sh/ruff-action@v4.0.0
        with:
          args: "check"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ env.LATEST_PYTHON_VERSION }}
        run: uv python install ${{ env.LATEST_PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Run tests with coverage
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 2
          max_attempts: 3
          command: uv run --no-sync coverage run -m pytest tests && uv run --no-sync coverage report && uv run --no-sync coverage xml
          shell: bash

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: pycaffeine-linux
            binary: pycaffeine-linux
          - os: macos-latest
            artifact_name: pycaffeine-macos
            binary: pycaffeine-macos
          - os: windows-latest
            artifact_name: pycaffeine-windows
            binary: pycaffeine-windows.exe
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ env.LATEST_PYTHON_VERSION }}
        run: uv python install ${{ env.LATEST_PYTHON_VERSION }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Build with PyInstaller
        run: uv run python scripts/pyinstaller_build.py

      - name: Rename artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: mv dist/pycaffeine dist/${{ matrix.binary }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: mv dist/pycaffeine.exe dist/${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.binary }}

  package:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ env.LATEST_PYTHON_VERSION }}
        run: uv python install ${{ env.LATEST_PYTHON_VERSION }}

      - name: Build wheel and sdist
        run: uv build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-packages
          path: dist/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, package]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release, package]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-packages
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1.14
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
          verbose: true
          attestations: false

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1.14
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true
          attestations: false
