[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycaffeine"
version = "1.0.0"
description = "Keep computer awake by moving the mouse around"
urls.Repository = "https://github.com/ddc/pycaffeine"
urls.Homepage = "https://github.com/ddc/pycaffeine"
license = { text = "MIT" }
readme = "README.md"
authors = [
  { name = "Daniel Costa", email = "daniel@ddcsoftwares.com" },
]
maintainers = [
  { name = "Daniel Costa" },
]
keywords = [
  "python", "python3", "caffeine", "keep-awake", "mouse-mover",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Utilities",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
]
requires-python = ">=3.14"
dependencies = [
  "pyautogui>=0.9.54",
  "PyQt6>=6.11.0",
]

[dependency-groups]
dev = [
  "poethepoet>=0.46.0",
  "pyinstaller>=6.20.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.15",
]

[tool.poe.tasks]
linter.shell = "uv run ruff check --fix . && uv run ruff format ."
updatedev.sequence = ["linter", {shell = "uv lock --upgrade && uv sync --all-extras --all-groups"}]
test.sequence = [{ shell = "uv run coverage run -m pytest" }, { shell = "uv run coverage report" }, { shell = "uv run coverage xml" }]
build.sequence = ["updatedev", "test", {shell = "uv run python scripts/pyinstaller_build.py"}]

[tool.pytest.ini_options]
addopts = "-v --import-mode=importlib"
testpaths = ["tests"]

[tool.coverage.run]
source = ["pycaffeine"]
omit = [
  "tests/*",
  "*/__init__.py",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"]
"scripts/*.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
no-lines-before = ["future", "standard-library", "third-party", "first-party", "local-folder"]
no-sections = true
